platform: x
as_of: 2026-11-05 (Europe/Lisbon). Code read at xai-org/x-algorithm commit 021afa44 (2026-11-05 05:16 WET).
summary: X ranks For You candidates by predicted actions (reply, quote, share, follow, dwell) weighted in code,
  drops candidates older than 48 hours from the main sources, and spreads out repeat posts from one author. Practitioners
  agree on strong first lines, native content, and summarizing links. They disagree on cadence and posting times.
length:
- claim: Standard posts are 280 characters; Premium long posts go up to 25,000 characters.
  confidence: medium
  source_refs:
  - web-x-premium-limits
  note: Third-party summary; X does not publish a single official page with both limits.
- claim: X Articles (Premium) allow roughly 100,000 characters.
  confidence: medium
  source_refs:
  - web-x-premium-limits
- claim: Long single posts and Articles are used for breakdowns (case studies, playbooks); threads remain common
    for step-by-step content.
  confidence: medium
  source_refs:
  - x-2108585781581217906
  - x-2111080389565640897
  - x-1538930462411968512
formatting:
- claim: Use headers on each body post of a thread, white space, a clear CTA or call-to-conversation, and a strong
    hook post.
  confidence: medium
  source_refs:
  - x-1538930467021504513
- claim: Make it scannable and platform-native.
  confidence: medium
  source_refs:
  - x-2111080389565640897
links:
- claim: No explicit rule limits the reach of links, but the algorithm tries to maximize user-seconds, so a link
    that cuts people's time short gets less exposure. Post a text/image/video summary of what's at the link.
  confidence: medium
  source_refs:
  - x-1915806794393457034
  note: Elon Musk, April 2025. Policy may have changed since.
- claim: Put the link in a reply instead of the post.
  confidence: low
  source_refs:
  - x-1915777220897083556
  note: 'Fan account (cb_doge), not an official source. Common practice (Ernesto: ''Full link in my first reply'').'
- claim: In the open-source ranker, open_link has weight 0.2 and click 0.274, far below reply (5.0), quote (5.0)
    and share via copy link (20.0).
  confidence: high
  source_refs:
  - code-x-algorithm-params
  note: Code defaults; production may override params at runtime.
media:
- claim: Photo expand has a small weight (0.05); video open and video quality view are 0 in the ranker defaults.
  confidence: high
  source_refs:
  - code-x-algorithm-params
  note: 'This does not mean media is useless: media can raise predicted dwell, replies and shares, which carry weight.'
- claim: Video content and image checklists from creators were seen in saved posts but could not be read as text
    (video/image only).
  confidence: low
  source_refs:
  - x-2115618441571013084
timing:
- claim: 'Buffer (8.7M posts, 2026): best slot Tuesday 9am local; next Wednesday 10am and 9am; weekday mid-mornings
    (about 9-11am) most reliable; evenings 6-11pm and weekends (Saturday worst) weakest.'
  confidence: medium
  source_refs:
  - web-buffer-x-2026
- claim: 'A summary of the same Buffer study: best window 8-11am weekdays, best day Wednesday, quietest Saturday
    then Sunday.'
  confidence: medium
  source_refs:
