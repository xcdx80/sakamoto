  note: Slightly different window from Buffer's page summary (8-11am vs 9-11am).
- claim: Posts made late on a Friday night after a burst of rapid posting underperform because few people are available
    to see them.
  confidence: medium
  source_refs:
  - x-2054454701639495856
  note: Nikita Bier (X), a reply in May 2026.
cadence:
- claim: Cole's team posts 5-8+ times per day on X.
  confidence: medium
