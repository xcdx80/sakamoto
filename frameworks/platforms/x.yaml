- claim: In the ranker, repeat posts from the same author are discounted (AuthorDiversityDecay 0.5 with a floor
    of 0.25).
  confidence: high
  source_refs:
  - code-x-algorithm-vm-params
  note: Code defaults; the exact decay curve depends on implementation. A second post in the same feed load gets
    less weight.
