unverified_claims:
- claim: '''X can only check 2,800 posts each time you open your feed.'''
  confidence: low
  source_refs:
  - x-2114368194546696576
  note: Not found in the public code at the commit read; the same post says 'How often X actually hits the 2,800
    limit isn't in the code'.
- claim: '''Likes: +0.66'' and ''Your second post appearing in someone''s feed reportedly gets only 62% of the first
    post''s value.'''
  confidence: low
  source_refs:
  - x-2114663830533939524
  note: Code shows favorite 0.708 (home-mixer) / 0.5 (vm-ranker) and author diversity decay 0.5. Numbers differ.
- claim: '''YOUR FIRST 2 HOURS MATTER'' and ''The first and 32nd likes may also unlock additional discovery opportunities.'''
  confidence: low
  source_refs:
  - x-2114663830533939524
  note: Not verified in code.
- claim: '''1 report cancels out 468 likes.'''
  confidence: low
  source_refs:
