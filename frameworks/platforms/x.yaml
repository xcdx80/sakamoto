  note: 'The README calls this a misconception: weights multiply predicted probabilities, not raw counts.'
disagreements:
- topic: How often to post
  positions:
  - who: Nicolas Cole
    position: 5-8+ posts per day on X.
    source_refs:
    - x-2035422609639395777
  - who: Daniel Vassallo
    position: No evidence that daily posting matters.
    confidence: low
    source_refs:
    - x-2078028115847110753
  - who: 0xHvdes
    position: Publish 5-7 high-quality posts per week.
    confidence: low
    source_refs:
    - x-2087548852173721792
  - who: x-algorithm (code)
    position: Repeat posts from one author are decayed within a feed load (0.5, floor 0.25).
    source_refs:
    - code-x-algorithm-vm-params
  takeaway: Volume helps only if quality holds; the engine should not suggest more than a few posts per day and
    should space them.
- topic: Best time to post
  positions:
  - who: Buffer 2026
    position: Weekday mid-mornings, Tuesday 9am best.
    source_refs:
    - web-buffer-x-2026
  - who: Nikita Bier
    position: Late Friday night after rapid posting has almost no audience.
    source_refs:
    - x-2054454701639495856
  takeaway: Default to weekday mornings in the audience's time zone; let the user's own analytics override.
engine_rules:
- Never put the only copy of the value behind a link; summarize first.
- Prefer endings that invite replies or quotes (call-to-conversation) for reach goals; reply and quote weights are
  5.0.
- Flag news-peg drafts whose sources are older than 48 hours.
- Do not quote unverified algorithm numbers as fact in drafts.
