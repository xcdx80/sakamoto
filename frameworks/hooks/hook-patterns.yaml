- id: before-after-gap
  name: Before / after gap
  template: 'I {bad starting point} in {year}. {N} years later: {results}. What changed?'
  description: Show the distance between two states and promise the bridge.
  why_it_works: The gap creates a question the reader wants answered.
  pitfalls:
  - The 'after' must be verifiable from sources.
  - Overused in income content; skeptical audiences discount it.
