# Generated by build/build.py (examples resolved from fetched posts).
description: Opening-line patterns the engine can pair with a framework. Each pattern has a fill-in template, why
  it works, pitfalls, and real fetched openers. Frameworks reference these ids in hook_patterns; used_by is generated.
  Ryan Growth lists the hook jobs as bold claim, callout, curiosity gap, clear outcome and contrarian; Welsh calls
  the hook post the part that 'makes or breaks your entire thread'.
general_rules:
- claim: 'The first line carries most of the weight; Welsh: ''The first line is more important than 95% of the rest
    of the post.'''
  confidence: medium
  source_refs:
  - web-welsh-anatomy-viral-linkedin
- claim: 'Write the hook last: body first, then headers, CTA, then the hook (Welsh''s thread process). Welsh''s
    LinkedIn process is the same: meat, then trailer.'
  confidence: medium
  source_refs:
  - x-1538930469080907776
  - web-welsh-writing-process
- claim: 'Good hooks do at least one of: bold claim, callout, curiosity gap, clear outcome, contrarian.'
  confidence: medium
  source_refs:
  - x-2111080389565640897
patterns:
- id: outcome-number
  name: Outcome with a number
  template: '{Subject} {achieved specific result} in {timeframe}{, constraint}.'
  description: Open with the result, measured. The method follows.
  why_it_works: 'A specific number is a credibility signal and a promise at once; specificity creates trust (Welsh:
    ''Specificity creates trust. Vague claims create doubt.'').'
  pitfalls:
  - Unsourced or rounded-up numbers.
  - Number with no method behind it reads as a brag.
