# Generated by build/build.py from build/src/long-form/lessons-learned-thread.yaml. Edit the source, not this file.
id: lessons-learned-thread
name: Lessons learned thread
form: long
family: story
summary: 'A milestone plus the lessons it taught, one lesson per post. Cole: share a lesson learned and the personal
  story of how you learned it. Welsh''s ''24 lessons'' thread shows the format at scale.'
when_to_use:
  source_signals:
  - signal: personal_story
    weight: 3
  - signal: mistakes_or_regrets
    weight: 2
  - signal: outcome_with_numbers
    weight: 2
    note: The milestone gives the lessons authority.
  - signal: case_with_timeline
    weight: 1
  goals:
    reach: 3
    trust: 3
    convert: 1
  notes: Needs the user's own notes or a source written by the person who lived it. Never invent lessons from someone
    else's life.
avoid_when:
- condition: No milestone or experience to anchor the lessons; they become generic advice.
  missing_signal: personal_story
- condition: Lessons are borrowed from a source author but would be presented as yours. Use success-story-thread
    instead.
better_than:
- framework: listicle
  when: Each item needs a short story or example to be believable.
- framework: if-i-had-to-do-it-again
  when: The value is what you learned, not a prescriptive plan for someone starting now.
structure:
- section: opener
  purpose: Milestone with date or duration and a number; promise N lessons.
  length: 1 post
- section: lessons
  purpose: 'One post per lesson: ''Lesson #N: {title}'', then 2-5 short lines with a concrete example.'
  length: 5-25 posts
- section: mid_cta
  purpose: Optional newsletter mention partway through (Welsh does this before the last lessons).
  length: 1 post
  optional: true
- section: wrap
  purpose: '''That''s it for today'' + follow/repost request.'
  length: 1 post
length:
  unit: posts
  min: 6
  max: 26
hook_patterns:
- pattern: before-after-gap
  template: 'On {date}, I {big change}. {N} years & {result} later, here''s everything I''ve learned. {N} lessons
    on {topics}:'
- pattern: outcome-number
  template: 'Last week my {thing} crossed {milestone}. It took {time}, {constraint}. Here are the {N} steps of my
    {adjective} journey:'
- pattern: story-cold-open
  template: 'When I {starting point}, {hard details}. {N} years later, {outcome}. Here''s what I''ve learned about
    {topic}:'
rubric:
  inherits: shared
  criteria:
  - id: lesson-has-evidence
    description: Each lesson includes a specific example, number or moment, not just a maxim.
    weight: 3
    anchors:
      '1': Maxims only.
      '3': About half have specifics.
      '5': Every lesson grounded in a specific moment from the sources.
    pass_threshold: 4
  - id: consistent-lesson-format
    description: Lessons share a format (numbered header, short body) that makes the thread skimmable.
    weight: 1
    anchors:
      '1': Inconsistent.
      '3': Mostly consistent.
      '5': Identical header pattern and body length.
    pass_threshold: 3
