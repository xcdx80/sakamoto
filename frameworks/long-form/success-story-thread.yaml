# Generated by build/build.py from build/src/long-form/success-story-thread.yaml. Edit the source, not this file.
id: success-story-thread
name: Success story breakdown
form: long
family: proof
summary: 'Break down how a credible person or company got a result, as numbered moves the reader can copy. Cole''s
  recipe: credibility + a surprising angle + lessons the reader can apply. Works directly off saved case studies,
  interviews and articles.'
when_to_use:
  source_signals:
  - signal: third_party_success
    weight: 3
    note: A saved source documents someone else's result in detail.
  - signal: outcome_with_numbers
    weight: 2
  - signal: case_with_timeline
    weight: 2
  - signal: discrete_items
    weight: 1
  goals:
    reach: 3
    trust: 2
    convert: 1
  notes: Every number and claim must come from the cited source; say 'per {source}' when the result is self-reported.
avoid_when:
- condition: The source is the subject's own marketing with no checkable numbers. Label it or skip.
- condition: The result is yours. Use case-study-long or lessons-learned-thread.
  signal: personal_story
better_than:
- framework: source-takeaways
  when: The source is long enough to support 8+ distinct moves and the subject is well known.
- framework: listicle
  when: A named person or company and a big number anchor the list.
structure:
- section: opener
  purpose: Who + the big number + timeframe; promise the breakdown.
  length: 1-3 lines
- section: moves
  purpose: Numbered moves; each is a headline line, then '->' or a short line with the specific detail.
  length: 6-22 items
- section: closer
  purpose: Where it ended up (a final number) or the credit for the source.
  length: 1-2 lines
length:
  unit: posts
  min: 1
  max: 15
  note: Often published as one long post on X (Premium) rather than a thread; both work.
hook_patterns:
- pattern: credibility-stack
  template: '{Person} is one of {credibility}. To date, {number}. Here''s the {adjective} story of how {surprising
    angle}:'
- pattern: outcome-number
  template: '{Company}, a {valuation} company, {grew metric by X%} in {time}. Here''s how:'
- pattern: parallel-best
  template: The most {superlative} {thing} in {place}, behind {company}'s {result}
rubric:
  inherits: shared
  criteria:
  - id: attributable-numbers
    description: Every number is attributed to the saved source, and self-reported results are labeled.
    weight: 3
    anchors:
      '1': Unattributed numbers.
      '3': Attributed but not labeled as self-reported.
      '5': All attributed; self-reported results flagged.
    pass_threshold: 5
    gate: true
  - id: copyable-moves
    description: Each move is something the reader could do, not just a fact about the subject.
    weight: 2
    anchors:
      '1': Biography.
      '3': Mix of biography and moves.
      '5': Each item is an action plus the detail that makes it work.
    pass_threshold: 3
