# Generated by build/build.py from build/src/long-form/deep-dive-article.yaml. Edit the source, not this file.
id: deep-dive-article
name: Deep-dive article
form: long
family: teach
summary: 'A long-form X Article, newsletter or LinkedIn article: a promise up front, a short table of contents,
  H2 sections that each teach one part, and a recap. It is where deep saved material (guides, reports, many sources
  on one theme) goes, and it feeds short posts afterwards.'
when_to_use:
  source_signals:
  - signal: deep_material
    weight: 3
  - signal: multiple_sources_same_topic
    weight: 2
  - signal: named_framework
    weight: 2
  - signal: data_or_stats
    weight: 1
  goals:
    reach: 2
    trust: 3
    convert: 3
  notes: 'Ryan Growth''s ''Distribution 101'' and Bush''s ''I am begging you to start building something'' share
    a shape: a promise, a ''here''s what you''ll learn'' list, sections, then a recap list and a CTA. Bush repurposes
    the article into short posts (see format-transfer).'
avoid_when:
- condition: There is one idea; it belongs in a short post.
  signal: single_sharp_idea
- condition: Sources are thin; padding a long piece hurts dwell and trust.
  missing_signal: deep_material
better_than:
- framework: framework-thread
  when: Sections need more than ~4 lines each, or include tables, images or links.
- framework: how-to-step-by-step
  when: The topic needs a why and context sections, not just steps.
structure:
- section: title
  purpose: Outcome-led title (often with a number).
  length: under 80 characters
- section: promise
  purpose: What the reader gets, or a bold opening claim.
  length: 1-4 short paragraphs
- section: contents
  purpose: Bulleted list of what's covered.
  length: 3-6 bullets
  optional: true
- section: sections
  purpose: One H2 per part, each with an example, data or a story from the sources.
  length: 3-7 sections
- section: recap
  purpose: One line per section.
  length: 3-7 lines
- section: cta
  purpose: Follow / subscribe / product, once, at the end (and optionally once near the top).
  length: 1-3 lines
length:
  unit: words
  min: 1200
  max: 5000
hook_patterns:
- pattern: outcome-number
  template: '{Title}: How {we/I} {result with number} {constraint}'
- pattern: blunt-truth
  template: There has never been a better time {to do X}. If you disagree, {dismissal}. Still here?
- pattern: numbered-list-promise
  template: In this {article}, I will explain {N} reasons why {claim} and what you should do about it.
rubric:
  inherits: shared
  criteria:
  - id: section-payoff
    description: Every section delivers a specific, sourced payoff (example, number, method).
    weight: 3
    anchors:
      '1': Sections are filler.
      '3': Most sections have a payoff.
      '5': Every section has a concrete, cited payoff.
    pass_threshold: 4
  - id: has-recap
    description: Ends with a recap that maps one line to each section.
    weight: 1
    anchors:
      '1': No recap.
      '3': Partial recap.
      '5': Complete recap.
    pass_threshold: 3
  - id: sponsor-disclosed
    description: Sponsored tools or affiliate links are disclosed.
    weight: 2
    anchors:
      '1': Undisclosed promotion.
      '3': Disclosed only at the end.
      '5': Disclosed clearly, or none present.
    pass_threshold: 5
    gate: true
