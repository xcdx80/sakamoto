platform_notes:
  x:
  - X Articles are available to Premium accounts (third-party sources put the limit around 100,000 characters; medium
    confidence). Ryan and Bush both ask for a like/repost/follow near the top or at the end.
  - The open-source ranker weights a continuous dwell-time action (cont_dwell_time) and a click-then-dwell action
    (cont_click_dwell_time 0.385), which favors pieces that hold readers. These are code defaults and may be overridden
    in production (medium confidence).
  linkedin:
  - Welsh (2022) suggests a LinkedIn newsletter once you reach 10-15k followers; long text posts cap at 3,000 characters,
    so articles are the long-form option there.
