id: if-i-had-to-do-it-again
name: If I had to start over
form: long
family: teach
summary: Credibility stack, then 'If I had to start from $0 again, here's what I'd do', then a concrete plan. It
  turns experience into a prescriptive plan for beginners, and it lets you drop what didn't work.
when_to_use:
  source_signals:
  - signal: author_has_credibility
    weight: 3
    note: The author has a track record in this domain.
  - signal: process_steps
    weight: 2
  - signal: mistakes_or_regrets
    weight: 2
  - signal: personal_story
    weight: 1
  goals:
    reach: 3
    trust: 3
    convert: 2
  notes: 'Cole Template #4. Also works as a section inside a newsletter or article (Bush''s Weekly Q&A, 0xHvdes''s
    weekly checklist).'
avoid_when:
- condition: The author has no track record to stand on.
  missing_signal: author_has_credibility
- condition: The plan is generic (be consistent, add value) with no numbers or specific choices.
better_than:
- framework: lessons-learned-thread
  when: Readers want a plan to follow, not a reflection.
- framework: how-to-step-by-step
  when: The procedure depends on judgment calls only experience gives (which platform, what to skip).
structure:
- section: credibility
  purpose: Years + 2-4 bullet achievements with numbers.
  length: 3-6 lines
- section: pivot_line
  purpose: '''If I had to start from {zero} again, here''s what I''d do:'''
  length: 1 line
- section: plan
  purpose: Numbered steps, each with a specific choice and a reason.
  length: 4-10 items
- section: caveat
  purpose: What changes by situation; the platform or tactic matters less than consistency (Bush).
  length: 1-3 lines
  optional: true
- section: close
  purpose: One-line summary or CTA.
  length: 1 line
length:
  unit: posts
  min: 1
  max: 12
hook_patterns:
- pattern: starting-over
  template: 'I started {activity} when I was {age}. Since then, I''ve... {bullets}. If I had to start from $0 again,
    here''s what I''d do:'
- pattern: credibility-stack
  template: 'We run a {revenue} {business} and have done {lifetime number} from {channel}. If I was starting over
    on {platform}, here''s exactly what I would do:'
rubric:
  inherits: shared
  criteria:
  - id: specific-choices
    description: The plan names specific choices (platforms, counts, cadences, tools) and why.
    weight: 3
    anchors:
      '1': Platitudes.
      '3': Some specifics.
      '5': Every step has a concrete choice and a reason.
    pass_threshold: 4
  - id: earned-credibility
    description: Credibility lines are factual and drawn from sources.
    weight: 2
    anchors:
      '1': Missing or vague.
      '3': Present but unsourced.
      '5': Specific and sourced.
    pass_threshold: 4
    gate: true
