id: real-reason-thread
name: The real reason
form: long
family: opinion
summary: 'Cole''s ''Here''s the real reason'' thread (the anthropological bucket): most people think X about something
  well known; that''s wrong; here''s the real reason it happened. Uses a famous story to teach a transferable idea.'
when_to_use:
  source_signals:
  - signal: common_belief_to_contradict
    weight: 3
  - signal: third_party_success
    weight: 2
    note: A well-known person, product or event.
  - signal: deep_material
    weight: 2
    note: Enough evidence to support the 'real reason'.
  goals:
    reach: 3
    trust: 2
    convert: 1
  notes: The 'real reason' must be supported by the saved sources; speculation framed as fact fails the grounding
    gate.
avoid_when:
- condition: The real reason is the writer's guess with no source.
  missing_signal: deep_material
- condition: The subject is not widely known, so there is no common belief to overturn.
better_than:
- framework: contrarian-take
  when: The contradiction is best shown through one famous case rather than argued in the abstract.
- framework: success-story-thread
  when: The interesting part is one hidden cause, not a list of moves.
structure:
- section: opener
  purpose: Famous subject + a credibility fact + 'what most people don't know is why'.
  length: 1 post, 3-5 lines
- section: reveal
  purpose: The real reason, stated plainly.
  length: 1 post
- section: evidence
  purpose: 2-5 posts of evidence from the sources.
  length: 2-5 posts
- section: transfer
  purpose: How the reader can use the same idea.
  length: 1-3 posts
- section: cta
  purpose: Follow / repost.
  length: 1 post
length:
  unit: posts
  min: 4
  max: 10
hook_patterns:
- pattern: curiosity-gap-real-reason
  template: In {year}, {person} {did famous thing}. What most people don't know is why {it worked}.
- pattern: label-opener
  template: '{Concept} 101'
rubric:
  inherits: shared
  criteria:
  - id: reason-is-sourced
    description: The 'real reason' is supported by cited saved sources, not asserted.
    weight: 3
    anchors:
      '1': Pure assertion.
      '3': One weak source.
      '5': Clear evidence from cited sources.
    pass_threshold: 5
    gate: true
  - id: transferable
    description: Ends with a lesson the reader can apply to their own work.
    weight: 2
    anchors:
      '1': Trivia only.
      '3': Implied lesson.
      '5': Explicit, actionable transfer.
    pass_threshold: 3
