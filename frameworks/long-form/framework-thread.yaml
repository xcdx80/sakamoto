platform_notes:
  x:
  - Post 1 must stand alone; Welsh says the hook post 'makes or breaks your entire thread'. Put links in the final
    post or a reply.
  - 'Ryan Growth: ''When something pops, make 5 more versions.'' A thread that worked can return later with a new
    opener.'
  linkedin:
  - Convert to a single long post or a carousel (one part per slide). LinkedIn's limit is 3,000 characters (Welsh
    2022; medium confidence it is unchanged).
