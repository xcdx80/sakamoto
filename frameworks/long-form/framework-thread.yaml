# Generated by build/build.py from build/src/long-form/framework-thread.yaml. Edit the source, not this file.
id: framework-thread
name: Framework thread (X / Y / Z)
form: long
family: teach
summary: 'Cole''s Framework Thread: to solve X (a well-known, difficult problem), I do Y (an unconventional thing),
  to achieve Z (a highly desirable outcome). The opener proves you have the outcome; each post is one step of a
  named method.'
when_to_use:
  source_signals:
  - signal: named_framework
    weight: 3
    note: The source describes a method with distinct, nameable parts.
  - signal: process_steps
    weight: 2
  - signal: outcome_with_numbers
    weight: 2
    note: Proof that the framework works.
  - signal: author_has_credibility
    weight: 1
  goals:
    reach: 3
    trust: 3
    convert: 2
  notes: 'Cole: ''Threads that give templates are big winners for readers. Everyone wants a shortcut.'''
avoid_when:
- condition: There is no outcome showing the framework works.
  missing_signal: outcome_with_numbers
- condition: The 'framework' is a renamed list of generic tips.
better_than:
- framework: how-to-step-by-step
  when: The steps form a reusable method with a name and a clear unconventional angle, not just a procedure for
    one task.
- framework: listicle
  when: The items depend on each other and add up to one system.
structure:
- section: opener
  purpose: Outcome + credibility + promise of the N-part framework.
  length: 1 post, 2-5 short lines
- section: overview
  purpose: 'Optional: list the parts so readers know what is coming.'
  length: 1 post
  optional: true
- section: parts
  purpose: 'One post per part: a header line, what to do, an example from the sources.'
  length: 3-8 posts, 2-6 lines each
- section: tldr
  purpose: Recap all parts in one post.
  length: 1 post
- section: cta
  purpose: Follow / repost the first post / read the long version (link here, not in post 1).
  length: 1 post
length:
  unit: posts
  min: 5
  max: 12
  note: On LinkedIn or as an X Article, the same structure becomes 600-1,500 words with H2 headers.
hook_patterns:
- pattern: credibility-stack
  template: 'In {year}, I {did X}. In {next year}, I plan on {more}. Here''s the {N}-step framework I use to {outcome}:'
- pattern: outcome-number
  template: '{Outcome with number}. Here''s the {name} framework behind it:'
- pattern: promise-plus-objection
  template: 'How to {outcome} ({without common obstacle}):'
rubric:
  inherits: shared
  criteria:
  - id: xyz-clarity
    description: Problem X, unconventional approach Y and outcome Z are all explicit in the opener or first two
      posts.
    weight: 3
    anchors:
      '1': One or more of X/Y/Z missing.
      '3': All present but Y is conventional.
      '5': X is a known pain, Y is non-obvious, Z is specific.
    pass_threshold: 4
  - id: headers-per-post
    description: Each body post starts with a header line that tells the reader what the post covers (Welsh).
    weight: 2
    anchors:
      '1': No headers; posts run together.
      '3': Some headers.
      '5': Every body post has a short, scannable header.
    pass_threshold: 3
