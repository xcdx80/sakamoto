id: how-to-step-by-step
name: How-to, step by step
form: long
family: teach
summary: '''How to {outcome}:'' then numbered, concrete steps someone can follow today. The most direct teaching
  format; the payoff is that the reader can do the thing after reading.'
when_to_use:
  source_signals:
  - signal: process_steps
    weight: 3
  - signal: outcome_with_numbers
    weight: 2
    note: A result from the method makes the hook (jakezward's $1M+ page).
  - signal: deep_material
    weight: 1
  goals:
    reach: 2
    trust: 3
    convert: 2
  notes: 'Steps must be precise enough to follow (menu paths, settings, exact prompts). Welsh''s thread: write the
    body first, then headers, then the CTA, then the hook.'
avoid_when:
- condition: The steps are vague or the process cannot be checked against a source.
  missing_signal: process_steps
- condition: Steps go stale fast (UI paths) and the source is older than a few months; note the date.
better_than:
- framework: framework-thread
  when: The value is a specific procedure for one task, not a reusable mental model.
- framework: what-how-why
  when: There are more than 5 steps or each step needs detail.
structure:
- section: hook
  purpose: '''How to {outcome}'' + optional objection handler ''(without {pain})'' or a result.'
  length: 1-3 lines
- section: why_now
  purpose: One line on the problem the steps solve.
  length: 1-2 lines
  optional: true
- section: steps
  purpose: 'Numbered steps: a header, then the exact action.'
  length: 4-10 steps
- section: why_it_works
  purpose: Short explanation of why the method works.
  length: 1-3 lines
  optional: true
- section: cta
  purpose: Follow / save / link to a longer version.
  length: 1 line
length:
  unit: posts
  min: 1
  max: 14
hook_patterns:
- pattern: promise-plus-objection
  template: 'How to {outcome}: ({without common obstacle})'
- pattern: outcome-number
  template: 'A single {thing} generated {result} for {who}. Here''s exactly how I create them:'
- pattern: label-opener
  template: how to {do specific task} with {tool}
rubric:
  inherits: shared
  criteria:
  - id: followable
    description: A reader could complete each step without searching elsewhere.
    weight: 3
    anchors:
      '1': Steps are goals, not actions.
      '3': Most steps actionable.
      '5': Every step has the exact action (path, setting, input).
    pass_threshold: 4
  - id: tldr-or-headers
    description: Uses step headers, and long versions end with a TL;DR (Welsh).
    weight: 1
    anchors:
      '1': Wall of text.
      '3': Numbered but no headers.
      '5': Headers + TL;DR.
    pass_threshold: 3
