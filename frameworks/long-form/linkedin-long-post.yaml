# Generated by build/build.py from build/src/long-form/linkedin-long-post.yaml. Edit the source, not this file.
id: linkedin-long-post
name: LinkedIn long post
form: long
family: teach
summary: 'A single LinkedIn text post of up to 3,000 characters: a 3-line ''trailer'' above the fold, the ''meat''
  (numbered sections with short lines), a TL;DR and a call-to-conversation. Welsh''s process, written meat first.'
when_to_use:
  source_signals:
  - signal: process_steps
    weight: 2
  - signal: discrete_items
    weight: 2
  - signal: author_has_credibility
    weight: 2
  - signal: personal_story
    weight: 1
  goals:
    reach: 2
    trust: 3
    convert: 3
  notes: 'This is a platform framework: a thread, listicle or lessons piece rewritten for LinkedIn. Bush describes
    250-500 word ''medium-form'' LinkedIn posts with the CTA in the post or the first comment.'
avoid_when:
- condition: The target is X only.
- condition: The content needs more than 3,000 characters; use a carousel or article.
better_than:
- framework: framework-thread
  when: Publishing on LinkedIn, which has no thread format.
- framework: listicle
  when: Each list item needs 2-5 lines of explanation.
structure:
- section: trailer
  purpose: '3 short lines above the fold: scroll-stopper, context, hook line that promises the meat.'
  length: ~140-210 characters
- section: meat
  purpose: Numbered sections, each a header line plus 1-5 short lines.
  length: 3-8 sections
- section: tldr
  purpose: One line per section so readers can comment without rereading.
  length: 3-8 lines
  optional: true
- section: ctc
  purpose: 'Call-to-conversation: a question, a request for a contrarian take, or an offer to answer questions.'
  length: 1-2 lines
- section: cta
  purpose: Optional link or follow ask; Welsh puts the link at the bottom.
  length: 1-2 lines
  optional: true
length:
  unit: characters
  min: 1000
  max: 3000
  note: 3,000-character limit; about 210 visible on desktop before 'see more' (Welsh 2022), about 140 on mobile
    (third-party, medium confidence).
hook_patterns:
- pattern: relatable-enemy
  template: The {relatable enemy} is {negative}. The {hero} is {strong positive}. And I {gasoline}. {Teaser question}?
- pattern: starting-over
  template: 'If I were starting on {platform} today and wanted to {goal}, here''s what I''d do:'
- pattern: outcome-number
  template: 'I {did X} in {N} moves. {Proof number} later, here''s the playbook:'
rubric:
  inherits: shared
  criteria:
  - id: above-the-fold
    description: The first ~140 characters (mobile fold) contain the hook and a reason to click 'see more'.
    weight: 3
    anchors:
      '1': Fold cuts mid-preamble.
      '3': Hook visible, no reason to expand.
      '5': Hook + clear promise before the fold.
    pass_threshold: 4
    checks:
    - len(first 3 lines) <= 210
  - id: tldr-ctc
    description: Ends with a TL;DR and a call-to-conversation.
    weight: 2
    anchors:
      '1': Neither.
      '3': One of the two.
      '5': Both, short.
    pass_threshold: 3
