# Generated by build/build.py from build/src/long-form/case-study-long.yaml. Edit the source, not this file.
id: case-study-long
name: Case study (long)
form: long
family: proof
summary: 'A first-person breakdown of a result you (or your team) produced: the outcome, the system behind it in
  numbered parts, the numbers at each step, and a recap. Long sibling of case-study-short.'
when_to_use:
  source_signals:
  - signal: outcome_with_numbers
    weight: 3
  - signal: case_with_timeline
    weight: 2
  - signal: process_steps
    weight: 2
  - signal: personal_story
    weight: 1
  goals:
    reach: 2
    trust: 3
    convert: 3
  notes: Bush's case study template (outcome headline, before/after, process, results) scales up into an article.
    Disclose sponsors; both fetched examples are sponsored.
avoid_when:
- condition: No first-hand numbers; use success-story-thread for third-party results.
  missing_signal: outcome_with_numbers
- condition: The piece would mostly be a tool advertisement.
better_than:
- framework: case-study-short
  when: The system has several parts and each needs its own numbers and screenshots.
- framework: success-story-thread
  when: The result is first-hand.
structure:
- section: outcome_headline
  purpose: The result with numbers in the title and first lines.
  length: title + 1-4 lines
- section: proof
  purpose: Screenshot or data that backs the headline.
  length: 1 image or 1-3 lines
- section: system
  purpose: Named parts (e.g., content machine + amplification), each with how it worked and its numbers.
  length: 2-5 sections
- section: costs_and_failures
  purpose: What it cost and what didn't work.
  length: 2-6 lines
  optional: true
- section: recap
  purpose: Step list the reader can copy.
  length: 4-8 lines
- section: cta_and_disclosure
  purpose: CTA and any sponsor disclosure.
  length: 1-3 lines
length:
  unit: words
  min: 800
  max: 4000
hook_patterns:
- pattern: outcome-number
  template: How we {did volume} and made {revenue} with {method}
- pattern: before-after-gap
  template: '{system} that took us from {before} to {after}'
rubric:
  inherits: shared
  criteria:
  - id: numbers-per-step
    description: Each part of the system carries its own numbers (cost, volume, views, conversion).
    weight: 3
    anchors:
      '1': Numbers only in the headline.
      '3': Some parts have numbers.
      '5': Every part has numbers.
    pass_threshold: 4
  - id: sponsor-disclosed
    description: Sponsored tools are disclosed as sponsored.
    weight: 2
    anchors:
      '1': Undisclosed.
      '3': Disclosed at the very end only.
      '5': Clearly disclosed, or none.
    pass_threshold: 5
    gate: true
