# Generated by build/build.py from build/src/long-form/curation-thread.yaml. Edit the source, not this file.
id: curation-thread
name: Curation thread
form: long
family: curation
summary: '''I did all this work, so you don''t have to.'' A niched-down collection of the best resources, tools,
  books or examples on one topic, each with one line on why it made the cut. Sakamoto''s library is the raw material.'
when_to_use:
  source_signals:
  - signal: multiple_sources_same_topic
    weight: 3
    note: Several saved sources on one narrow topic.
  - signal: discrete_items
    weight: 2
  - signal: author_has_credibility
    weight: 1
    note: The volume of work behind the selection (e.g., '500 business books').
  goals:
    reach: 3
    trust: 2
    convert: 1
  notes: 'Cole: niche down hard. ''Biz books to read on investing'' > ''Best biz books'' > ''Best books''.'
avoid_when:
- condition: Fewer than ~5 strong sources on the topic.
- condition: The topic is broad ('best books'); narrow it first.
better_than:
- framework: listicle
  when: Each item is an external resource the reader can go use, and the selection effort is the value.
- framework: source-takeaways
  when: You have many sources, none of which deserves a post alone.
structure:
- section: opener
  purpose: The work you did (volume, years) + the narrow topic + the count.
  length: 1 post
- section: items
  purpose: 'One item per post or line: name, creator, one line on why, link if needed.'
  length: 5-15 items
- section: wrap
  purpose: Ask readers for what you missed; follow CTA.
  length: 1 post
length:
  unit: posts
  min: 5
  max: 16
  note: 'Short version: one long post with a list (Welsh''s ''6 tools'' post).'
hook_patterns:
- pattern: credibility-stack
  template: 'Over the past {N} years, I have {consumed volume}. {Most of it was X}. Save yourself the time and just
    {read/use} these {N}:'
- pattern: numbered-list-promise
  template: '{N} {resources} every {narrow audience} should know about:'
rubric:
  inherits: shared
  criteria:
  - id: narrow-topic
    description: The collection is scoped to a narrow topic and audience.
    weight: 2
    anchors:
      '1': Broad ('best tools').
      '3': Somewhat narrow.
      '5': Narrow and specific to the audience.
    pass_threshold: 3
  - id: why-each-item
    description: Every item has a one-line reason drawn from the saved source.
    weight: 3
    anchors:
      '1': Bare names.
      '3': Some reasons.
      '5': Specific reason per item, cited.
    pass_threshold: 4
