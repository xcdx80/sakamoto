# Generated by build/build.py: matrix and framework comparisons come from the framework files.
description: How the engine picks candidate frameworks for a topic. Step 1 tags the retrieved saved sources with
  signals. Step 2 scores every framework with the matrix (generated from each framework's when_to_use and avoid_when).
  Step 3 keeps the top candidates, diversified by family, and drafts one option per framework.
scoring:
  formula: |-
    score(f) = sum(matrix[f].signals[s] * strength[s] for s in detected signals)
             + goal_weight * matrix[f].goals[goal]
             - penalty * count(s in matrix[f].penalize_if detected)
             - penalty * count(s in matrix[f].penalize_if_missing not detected)
  steps:
  - Detect signals across the retrieved sources; strength[s] is 1 (weak) or 2 (strong, e.g., an explicit number
    with a source).
  - 'goal is the user''s goal for the post: reach, trust or convert (default reach).'
  - Drop frameworks of the wrong form when the user asked for short or long.
  - Sort by score; walk the list and skip a framework if two already chosen share its family.
  - 'Keep 3-5. If a framework with needs_examples: true is chosen, say so in the justification.'
  - Use comparisons to break ties and to write the 'why this framework' justification.
  defaults:
    goal_weight: 1.5
    penalty: 3
    max_candidates: 5
    min_candidates: 3
    max_per_family: 2
signals:
- id: outcome_with_numbers
  description: A concrete result with a number (revenue, users, views, time).
  detect: Number + unit + result verb in a source sentence; must be attributable.
- id: before_after
  description: A clear before state and after state.
  detect: Two time markers or 'used to / now' with different states.
- id: personal_story
  description: First-person experience from the user's own notes or the source author.
  detect: First-person past tense narrative; for user voice, only from the user's own saved notes.
- id: third_party_success
  description: A named person or company's result, documented in a source.
  detect: Named entity + result + how.
- id: common_belief_to_contradict
  description: A widely held belief the source challenges.
  detect: '''Most people think'', ''everyone says'', quoted conventional wisdom followed by ''but''.'
- id: old_vs_new_contrast
  description: An old way and a new way of doing the same job.
  detect: '''Old way / new way'', ''instead of'', ''used to''.'
- id: discrete_items
  description: A set of parallel, listable items (tools, tips, mistakes, books).
  detect: Bulleted or numbered lists, or 3+ parallel items in prose.
- id: process_steps
  description: An ordered procedure.
  detect: Numbered steps, 'first/then/finally', menu paths.
- id: named_framework
  description: A method with named parts.
  detect: Acronyms, capitalized part names, 'the N-step/part framework'.
- id: mistakes_or_regrets
  description: Errors or things the author would do differently.
  detect: '''mistake'', ''I wish'', ''if I started over''.'
- id: breaking_news
  description: Event under ~48 hours old.
  detect: Source created_at within 48h and describes an announcement or change.
- id: proven_format_elsewhere
  description: A structure that outperformed in another niche or platform.
  detect: High engagement on a saved post relative to its author's usual, or an explicit 'format' discussion.
- id: multiple_sources_same_topic
  description: Three or more saved sources on one narrow topic.
  detect: Retrieval cluster size >= 3.
- id: deep_material
  description: Long-form source material (articles, guides, transcripts).
  detect: Source length > ~1,500 words or several medium sources.
- id: data_or_stats
  description: Data tables, survey results, studies.
  detect: Percentages, sample sizes, charts referenced.
- id: single_sharp_idea
  description: One idea that stands alone.
  detect: Short source or a single quotable claim; nothing to list.
- id: open_question
  description: An unresolved question worth asking the audience.
  detect: Sources disagree, or the user's notes end in a question.
- id: quotable_source_post
  description: A saved post strong enough to quote or react to.
  detect: Saved X post with high engagement or from a credible author.
- id: case_with_timeline
  description: Events with dates or durations.
  detect: Dates, 'in N months', step timings.
- id: author_has_credibility
  description: The user (or quoted author) has a relevant track record.
  detect: From the user's profile settings, or the source author's stated results.
comparisons:
- prefer: outcome-first
  over: story-lesson
  when: Goal is convert and the source has a hard number; stories build trust but numbers carry conversion posts.
  origin: hand
- prefer: story-lesson
  over: outcome-first
  when: Goal is trust and the source has an emotional turning point; leading with a number would read as a brag.
  origin: hand
- prefer: source-takeaways
  over: this-just-happened
  when: The saved source is older than ~48 hours; the For You window has passed but the ideas still hold.
  origin: hand
- prefer: deep-dive-article
  over: framework-thread
  when: On X, the user has Premium and the material needs tables, images or more than ~10 posts.
  origin: hand
- prefer: linkedin-long-post
  over: framework-thread
  when: Target platform is LinkedIn.
  origin: hand
- prefer: case-study-long
  over: case-study-short
  when: The system has several parts and each needs its own numbers and screenshots.
  origin: case-study-long.better_than
- prefer: case-study-long
  over: success-story-thread
  when: The result is first-hand.
  origin: case-study-long.better_than
- prefer: case-study-short
  over: outcome-first
  when: The reader needs to see the 'before' to believe the 'after', or you want a conversion CTA.
  origin: case-study-short.better_than
- prefer: case-study-short
  over: success-story-thread
  when: The case fits in one post and the audience wants proof, not a narrative.
  origin: case-study-short.better_than
- prefer: contrarian-take
  over: single-paragraph-insight
  when: The idea only lands because it pushes against a known belief. Naming the belief makes it sharper.
  origin: contrarian-take.better_than
- prefer: contrarian-take
  over: old-vs-new
  when: There is one wrong belief to correct rather than two complete ways of working to compare.
  origin: contrarian-take.better_than
- prefer: contrarian-take
  over: listicle
  when: You have one strong correction instead of many small tips.
  origin: contrarian-take.better_than
- prefer: curation-thread
  over: listicle
  when: Each item is an external resource the reader can go use, and the selection effort is the value.
  origin: curation-thread.better_than
- prefer: curation-thread
  over: source-takeaways
  when: You have many sources, none of which deserves a post alone.
  origin: curation-thread.better_than
- prefer: deep-dive-article
  over: framework-thread
  when: Sections need more than ~4 lines each, or include tables, images or links.
  origin: deep-dive-article.better_than
- prefer: deep-dive-article
  over: how-to-step-by-step
  when: The topic needs a why and context sections, not just steps.
  origin: deep-dive-article.better_than
- prefer: format-transfer
  over: listicle
  when: You have spotted an outlier format whose shape does more work than a plain list.
  origin: format-transfer.better_than
- prefer: format-transfer
  over: deep-dive-article
  when: The long piece already exists; extracting short posts from it is cheaper than writing new ones.
  origin: format-transfer.better_than
- prefer: framework-thread
  over: how-to-step-by-step
  when: The steps form a reusable method with a name and a clear unconventional angle, not just a procedure for
    one task.
  origin: framework-thread.better_than
- prefer: framework-thread
  over: listicle
  when: The items depend on each other and add up to one system.
  origin: framework-thread.better_than
- prefer: how-to-step-by-step
  over: framework-thread
  when: The value is a specific procedure for one task, not a reusable mental model.
  origin: how-to-step-by-step.better_than
- prefer: how-to-step-by-step
  over: what-how-why
  when: There are more than 5 steps or each step needs detail.
  origin: how-to-step-by-step.better_than
- prefer: if-i-had-to-do-it-again
  over: lessons-learned-thread
  when: Readers want a plan to follow, not a reflection.
  origin: if-i-had-to-do-it-again.better_than
- prefer: if-i-had-to-do-it-again
  over: how-to-step-by-step
  when: The procedure depends on judgment calls only experience gives (which platform, what to skip).
  origin: if-i-had-to-do-it-again.better_than
- prefer: lessons-learned-thread
  over: listicle
  when: Each item needs a short story or example to be believable.
  origin: lessons-learned-thread.better_than
- prefer: lessons-learned-thread
  over: if-i-had-to-do-it-again
  when: The value is what you learned, not a prescriptive plan for someone starting now.
  origin: lessons-learned-thread.better_than
- prefer: linkedin-long-post
  over: framework-thread
  when: Publishing on LinkedIn, which has no thread format.
  origin: linkedin-long-post.better_than
- prefer: linkedin-long-post
  over: listicle
  when: Each list item needs 2-5 lines of explanation.
  origin: linkedin-long-post.better_than
- prefer: listicle
  over: what-how-why
  when: Items do not share a single 'what' and do not need a 'why' close.
  origin: listicle.better_than
- prefer: listicle
  over: single-paragraph-insight
  when: The value is in the breadth of items, not the depth of one idea.
  origin: listicle.better_than
- prefer: old-vs-new
  over: contrarian-take
  when: You have two complete workflows to compare, not one belief to correct.
  origin: old-vs-new.better_than
- prefer: old-vs-new
  over: what-how-why
  when: The reader needs to see what they are doing now before they will accept the new steps.
  origin: old-vs-new.better_than
- prefer: outcome-first
  over: listicle
  when: The list items all serve one measured result. The number turns a generic list into a credible one.
  origin: outcome-first.better_than
- prefer: outcome-first
  over: story-lesson
  when: The reader cares about the result more than the journey, and the source has no emotional turning point.
  origin: outcome-first.better_than
- prefer: outcome-first
  over: case-study-short
  when: The result is yours or the source author's own, not a client's, so the before/us/after scaffolding would
    feel forced.
  origin: outcome-first.better_than
- prefer: question-engagement
  over: single-paragraph-insight
  when: The sources disagree and the honest move is to ask rather than to pick a side.
  origin: question-engagement.better_than
- prefer: question-engagement
  over: contrarian-take
  when: You lack evidence to take a strong stance but the topic is live.
  origin: question-engagement.better_than
- prefer: real-reason-thread
  over: contrarian-take
  when: The contradiction is best shown through one famous case rather than argued in the abstract.
  origin: real-reason-thread.better_than
- prefer: real-reason-thread
  over: success-story-thread
  when: The interesting part is one hidden cause, not a list of moves.
  origin: real-reason-thread.better_than
- prefer: single-paragraph-insight
  over: listicle
  when: There is one idea, and splitting it into bullets would make it feel like a checklist.
  origin: single-paragraph-insight.better_than
- prefer: single-paragraph-insight
  over: contrarian-take
  when: The stance does not need a named opponent to land.
  origin: single-paragraph-insight.better_than
- prefer: source-takeaways
  over: curation-thread
  when: There is one standout source rather than many.
  origin: source-takeaways.better_than
- prefer: source-takeaways
  over: this-just-happened
  when: The source is not news; the value is in your reading of it.
  origin: source-takeaways.better_than
- prefer: story-lesson
  over: single-paragraph-insight
  when: The insight is more believable when the reader sees how it was learned.
  origin: story-lesson.better_than
- prefer: story-lesson
  over: outcome-first
  when: The emotional turn matters more than the number.
  origin: story-lesson.better_than
- prefer: success-story-thread
  over: source-takeaways
  when: The source is long enough to support 8+ distinct moves and the subject is well known.
  origin: success-story-thread.better_than
- prefer: success-story-thread
  over: listicle
  when: A named person or company and a big number anchor the list.
  origin: success-story-thread.better_than
- prefer: this-just-happened
  over: listicle
  when: The items are all consequences of one fresh event; the news peg adds urgency.
  origin: this-just-happened.better_than
- prefer: this-just-happened
  over: contrarian-take
  when: The hook is the event, not the belief.
  origin: this-just-happened.better_than
- prefer: what-how-why
  over: listicle
  when: The items all serve one goal and the reader needs a reason to act.
  origin: what-how-why.better_than
- prefer: what-how-why
  over: single-paragraph-insight
  when: The idea is actionable and bullets make the actions obvious.
  origin: what-how-why.better_than
