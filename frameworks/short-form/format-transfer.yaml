# Generated by build/build.py from build/src/short-form/format-transfer.yaml. Edit the source, not this file.
id: format-transfer
name: Format transfer
form: short
family: remix
summary: 'Reuse a proven format, not its content: take a structure that is working elsewhere (another niche, another
  platform, or your own long-form piece) and fill it with the ideas from your saved sources.'
when_to_use:
  source_signals:
  - signal: proven_format_elsewhere
    weight: 3
    note: A saved post's structure is outperforming (an outlier) and can carry a different topic.
  - signal: deep_material
    weight: 2
    note: Your own long piece can be cut into short posts (Lean Writing Method).
  - signal: quotable_source_post
    weight: 1
  goals:
    reach: 3
    trust: 1
    convert: 1
  notes: 'Two flavors. (a) Cross-niche: MrBeast''s ''$1 vs $10,000 cake'' became ''$1 vs $1M engineer'' (irabukht
    summary of victorgu0). (b) Cross-format: one article becomes several short posts, or a top X post becomes a
    LinkedIn post the next morning (Cole). Ryan Growth: ''Steal formats (not content).'''
avoid_when:
- condition: You would be copying the original's words or ideas, not its structure.
- condition: The borrowed format only worked because of the original author's media (video, a celebrity).
better_than:
- framework: listicle
  when: You have spotted an outlier format whose shape does more work than a plain list.
- framework: deep-dive-article
  when: The long piece already exists; extracting short posts from it is cheaper than writing new ones.
structure:
- section: identify_format
  purpose: 'Internal step: name the source format and why it works (hook type, structure, length).'
  length: not published
- section: map
  purpose: 'Internal step: map your saved-source ideas onto each slot of the format.'
  length: not published
- section: hook
  purpose: The borrowed hook shape with your topic.
  length: 1-2 lines
- section: body
  purpose: Your content in the borrowed structure.
  length: matches the source format
- section: credit_or_link
  purpose: Credit the format's origin when it is recognizable, or link the long-form original.
  length: 0-1 line
  optional: true
length:
  unit: characters
  min: 100
  max: 2500
  note: Inherits the length of the borrowed format.
hook_patterns:
- pattern: outcome-number
  template: '{borrowed hook shape, rewritten for your topic}'
- pattern: story-cold-open
  template: '{an opening lifted from your own long piece}'
rubric:
  inherits: shared
  criteria:
  - id: structure-not-content
    description: Borrows structure only; all ideas, facts and phrasing are your own or cited.
    weight: 3
    anchors:
      '1': Copies the original's wording or ideas.
      '3': Structure borrowed, some phrasing too close.
      '5': Clearly the same shape, entirely new content with citations.
    pass_threshold: 5
    gate: true
  - id: native-fit
    description: The result reads native to the target platform, not like a pasted export.
    weight: 2
    anchors:
      '1': Obvious copy-paste artifacts (thread numbering on LinkedIn, hashtags on X).
      '3': Mostly native.
      '5': Reads as if written for this platform.
    pass_threshold: 3
