id: what-how-why
name: What, How, Why
form: short
family: teach
summary: First line says what you want the reader to do or know, the middle 3-5 bullets say how, and the last sentence
  says why it matters. A repeatable shape for any actionable idea.
when_to_use:
  source_signals:
  - signal: single_sharp_idea
    weight: 2
    note: There is one recommendation to make.
  - signal: process_steps
    weight: 2
    note: The source contains 3-5 concrete actions.
  - signal: named_framework
    weight: 1
  goals:
    reach: 2
    trust: 3
    convert: 1
  notes: 'Cole: works in any niche. The close should motivate action or name the cost of inaction.'
avoid_when:
- condition: There is no actionable 'how' in the sources; it becomes a vague motivational post.
  missing_signal: process_steps
- condition: The steps exceed five or need explanation each; use how-to-step-by-step.
better_than:
- framework: listicle
  when: The items all serve one goal and the reader needs a reason to act.
- framework: single-paragraph-insight
  when: The idea is actionable and bullets make the actions obvious.
structure:
- section: what
  purpose: The point, as a hook line.
  length: 1-2 lines
- section: how
  purpose: Concrete actions, parallel bullets.
  length: 3-5 bullets
- section: why
  purpose: 'Why it matters: payoff or cost of not doing it.'
  length: 1 sentence
length:
  unit: characters
  min: 150
  max: 700
hook_patterns:
- pattern: label-opener
  template: 'A simple framework to {desired outcome}:'
- pattern: promise-plus-objection
  template: 'How to {outcome} ({without common obstacle}):'
rubric:
  inherits: shared
  criteria:
  - id: three-part-shape
    description: Clear what (first line), how (3-5 bullets), why (last sentence).
    weight: 2
    anchors:
      '1': Missing one of the three parts.
      '3': All parts present but the why is generic.
      '5': All parts tight; the why names a specific payoff or cost.
    pass_threshold: 4
  - id: actionable-bullets
    description: Each bullet is something the reader can do today.
    weight: 3
    anchors:
      '1': Bullets are attitudes, not actions.
      '3': Mix of actions and attitudes.
      '5': Every bullet is a concrete action.
    pass_threshold: 4
