# Generated by build/build.py from build/src/short-form/case-study-short.yaml. Edit the source, not this file.
id: case-study-short
name: Case study (before / after)
form: short
family: proof
summary: 'Bush''s case-study shape: big outcome headline, what they did before and what it cost them, what changed,
  the positive result, why it was simple, an honest disclaimer, and a CTA.'
when_to_use:
  source_signals:
  - signal: before_after
    weight: 3
    note: The source documents a clear before state and after state.
  - signal: third_party_success
    weight: 2
    note: A named company or person, not just the author.
  - signal: outcome_with_numbers
    weight: 2
  - signal: case_with_timeline
    weight: 1
  goals:
    reach: 2
    trust: 3
    convert: 3
  notes: The conversion format. Bush's template was written for business owners showing client results; for InView
    it also fits a saved case study told in your words with a citation.
avoid_when:
- condition: The before state is not documented in the source; do not imagine one.
  missing_signal: before_after
- condition: The result is not attributable (no named subject or source).
better_than:
- framework: outcome-first
  when: The reader needs to see the 'before' to believe the 'after', or you want a conversion CTA.
- framework: success-story-thread
  when: The case fits in one post and the audience wants proof, not a narrative.
structure:
- section: outcome_headline
  purpose: BIG OUTCOME HEADLINE.
  length: 1 line
- section: before
  purpose: Before, they used to X.
  length: 1-2 lines
- section: cost
  purpose: X led to a negative result and an ultimate negative result.
  length: 1-2 lines
- section: change
  purpose: Then they did Y (with us, or with the method in the source).
  length: 1-3 lines
- section: result
  purpose: Y led to a positive result and an ultimate positive result, with numbers.
  length: 1-4 lines
- section: simplicity
  purpose: The best part? It was simple/easy/fast/cheap.
  length: 1 line
  optional: true
- section: disclaimer
  purpose: Not everyone sees this result.
  length: 1 line
- section: cta
  purpose: Want help? / read the source.
  length: 1 line
  optional: true
length:
  unit: characters
  min: 250
  max: 1800
hook_patterns:
- pattern: outcome-number
  template: '{Company}, a {credibility marker}, {increased metric} by {X}% in {timeframe}.'
- pattern: before-after-gap
  template: Before {change}, {subject} {old way}. Now {result}.
rubric:
  inherits: shared
  criteria:
  - id: before-after-documented
    description: Both states are stated with evidence from the source.
    weight: 3
    anchors:
      '1': Before state implied or invented.
      '3': Before state stated vaguely.
      '5': Before and after both specific and cited.
    pass_threshold: 4
    gate: true
  - id: honest-disclaimer
    description: Includes a plain disclaimer that results vary, or the limits of the case.
    weight: 1
    anchors:
      '1': No disclaimer, result framed as guaranteed.
      '3': Implied caveat.
      '5': Clear, short disclaimer.
    pass_threshold: 3
