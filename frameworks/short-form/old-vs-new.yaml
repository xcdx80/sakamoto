# Generated by build/build.py from build/src/short-form/old-vs-new.yaml. Edit the source, not this file.
id: old-vs-new
name: Old vs new
form: short
family: opinion
summary: 'Put two ways of doing the same job side by side: the old (or common, or bad) way and the new (or better)
  way, with tangible detail on both sides. The symmetry makes it scannable; the contrast does the persuading.'
when_to_use:
  source_signals:
  - signal: old_vs_new_contrast
    weight: 3
    note: The source describes a shift in how something is done (tools, channels, habits).
  - signal: common_belief_to_contradict
    weight: 1
  - signal: discrete_items
    weight: 1
    note: Each side can be shown with concrete steps or details.
  goals:
    reach: 3
    trust: 1
    convert: 2
  notes: 'Cole lists archetype pairs that also fit: bad vs good, rich vs poor, right vs wrong, legacy vs cutting-edge.'
avoid_when:
- condition: You can only describe one side concretely. A vague 'old way' becomes a straw man.
- condition: The 'new way' is just your product with no evidence it works better (reads as an ad).
better_than:
- framework: contrarian-take
  when: You have two complete workflows to compare, not one belief to correct.
- framework: what-how-why
  when: The reader needs to see what they are doing now before they will accept the new steps.
structure:
- section: frame
  purpose: Optional one-line setup naming the job both ways do.
  length: 1 line
  optional: true
- section: old
  purpose: The old/common way, with tangible details the reader recognizes.
  length: 1-4 lines
- section: new
  purpose: The new/better way, mirroring the old side line for line.
  length: 1-4 lines
- section: payoff
  purpose: Why the new way wins (time, money, result) with evidence from the source.
  length: 1-2 lines
  optional: true
length:
  unit: characters
  min: 80
  max: 900
hook_patterns:
- pattern: old-new-label
  template: 'Old way: {familiar painful process}. New way: {better process}.'
- pattern: contrarian-callout
  template: 'The popular narrative: "{common story}" The better narrative: "{evidence-backed story}"'
rubric:
  inherits: shared
  criteria:
  - id: symmetry
    description: Both sides describe the same job at the same level of detail, so the reader can compare.
    weight: 2
    anchors:
      '1': Sides describe different things or one side is a single vague word.
      '3': Same job, but one side is much thinner.
      '5': Parallel structure, matching detail, easy to scan.
    pass_threshold: 3
  - id: tangible-sides
    description: Each side uses concrete actions or details from the source, so the reader knows which side they
      are on.
    weight: 2
    anchors:
      '1': Abstract labels only ('slow', 'modern').
      '3': Some concrete detail.
      '5': Specific actions, tools or numbers on both sides.
    pass_threshold: 3
