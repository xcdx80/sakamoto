# Generated by build/build.py from build/src/short-form/source-takeaways.yaml. Edit the source, not this file.
id: source-takeaways
name: Takeaways from a source
form: short
family: curation
summary: Quote or link one saved post or article and give your numbered takeaways from it. The source carries the
  proof; your takeaways carry the point of view. Native to a knowledge library like InView.
when_to_use:
  source_signals:
  - signal: quotable_source_post
    weight: 3
    note: One saved post or article is strong enough to quote.
  - signal: deep_material
    weight: 1
  - signal: author_has_credibility
    weight: 1
    note: Credibility of the quoted author.
  goals:
    reach: 2
    trust: 3
    convert: 1
  notes: Cole's 'So many takeaways, I have to share:' quote post. A one-line 'Must read.' quote (hnshah) is the
    minimal version but adds little value of its own.
avoid_when:
- condition: You would be restating the source without adding anything.
- condition: The quoted source is low-credibility; your endorsement transfers to it.
better_than:
- framework: curation-thread
  when: There is one standout source rather than many.
- framework: this-just-happened
  when: The source is not news; the value is in your reading of it.
structure:
- section: reaction
  purpose: One line on why this source matters.
  length: 1 line
- section: takeaways
  purpose: Numbered takeaways, each a claim plus your reasoning.
  length: 2-5 items, 1-4 lines each
- section: quote_or_link
  purpose: Quote-post the source on X; on LinkedIn, screenshot or link in the first comment.
  length: attachment
length:
  unit: characters
  min: 200
  max: 2500
hook_patterns:
- pattern: reaction-to-source
  template: 'So many takeaways, I have to share:'
- pattern: reaction-to-source
  template: '{Credible person} just gave away {what}. Here''s what stood out:'
rubric:
  inherits: shared
  criteria:
  - id: adds-perspective
    description: Each takeaway adds an interpretation, implication or disagreement, not just a summary.
    weight: 3
    anchors:
      '1': Pure summary.
      '3': Half summary, half perspective.
      '5': Every takeaway adds the writer's own reasoning.
    pass_threshold: 4
  - id: faithful-to-source
    description: Represents the quoted source accurately.
    weight: 3
    anchors:
      '1': Misstates the source.
      '3': Loose paraphrase.
      '5': Accurate, with exact quotes where it matters.
    pass_threshold: 5
    gate: true
