# Generated by build/build.py from build/src/short-form/this-just-happened.yaml. Edit the source, not this file.
id: this-just-happened
name: This just happened
form: short
family: news
summary: Write about a trending event inside its 24-48 hour hype cycle, with your own take, relevant to your niche.
  The news is the hook; the take is the value.
when_to_use:
  source_signals:
  - signal: breaking_news
    weight: 3
    note: A saved source is under ~48 hours old and is about a real change or announcement.
  - signal: author_has_credibility
    weight: 1
  - signal: data_or_stats
    weight: 1
  goals:
    reach: 3
    trust: 1
    convert: 1
  notes: 'Cole''s recipe: write about a trending topic; give your own unique take; the take must be relevant to
    your niche. X''s For You candidate sources cap post age at 48 hours (MAX_POST_AGE in the open-source code).'
avoid_when:
- condition: The event is older than ~48 hours; it has left the hype cycle and the For You window.
- condition: You have no take beyond restating the news.
- condition: The news itself is unverified; label second-hand claims as reported and say what you could not verify.
better_than:
- framework: listicle
  when: The items are all consequences of one fresh event; the news peg adds urgency.
- framework: contrarian-take
  when: The hook is the event, not the belief.
structure:
- section: news_peg
  purpose: What happened, with the key fact (who, what, number).
  length: 1-2 lines
- section: context
  purpose: Why it matters or what was already true.
  length: 1-4 lines
- section: take
  purpose: 'Your angle: what it means for your niche, what to do.'
  length: 3-8 lines or bullets
- section: verification_note
  purpose: What is confirmed vs reported.
  length: 0-1 line
  optional: true
- section: close
  purpose: One-line takeaway or a question.
  length: 1 line
length:
  unit: characters
  min: 200
  max: 2500
hook_patterns:
- pattern: news-peg
  template: Today, {actor} announced {event}. {Key number}.
- pattern: label-opener
  template: '{TOPIC} UPDATE: {one-line summary of the change}'
rubric:
  inherits: shared
  criteria:
  - id: freshness
    description: The cited event is within ~48 hours at publish time.
    weight: 2
    anchors:
      '1': Older than a week.
      '3': 2-7 days old.
      '5': Under 48 hours.
    pass_threshold: 3
    checks:
    - newest cited source created_at within 48h of draft time
  - id: own-take
    description: Adds an angle relevant to the niche beyond restating the news.
    weight: 3
    anchors:
      '1': Pure restatement.
      '3': Generic implication.
      '5': Specific, niche-relevant implication or action.
    pass_threshold: 4
  - id: verification-labeled
    description: Second-hand or unverified claims are labeled as such.
    weight: 2
    anchors:
      '1': Unverified claims stated as fact.
      '3': Some hedging.
      '5': Clear split between confirmed and reported.
    pass_threshold: 4
    gate: true
