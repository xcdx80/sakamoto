# Generated by build/build.py from build/src/short-form/listicle.yaml. Edit the source, not this file.
id: listicle
name: Listicle
form: short
family: teach
summary: One opening line that promises a specific set (tips, tools, mistakes, lessons), then a skimmable list that
  delivers exactly that. It compresses an article into seconds of reading.
when_to_use:
  source_signals:
  - signal: discrete_items
    weight: 3
    note: The source has 3-10 separable items of the same type.
  - signal: multiple_sources_same_topic
    weight: 1
    note: Items can be pulled from several saved sources.
  - signal: author_has_credibility
    weight: 1
  goals:
    reach: 3
    trust: 2
    convert: 1
  notes: 'Cole''s list of listable things: tips, skills, tools, traits, steps, goals, books, habits, stories, quotes,
    secrets, insights, benefits, lessons, reasons, creators, routines, mistakes, podcasts, examples, questions,
    inventions, templates, resources, challenges, companies, data points, realizations, frameworks, presentations.'
avoid_when:
- condition: Items are generic or obvious; the list must be differentiated to beat the 'fluff' baseline.
- condition: Items depend on each other in order; use how-to-step-by-step instead.
  signal: process_steps
- condition: There is one big idea; splitting it into items dilutes it.
  signal: single_sharp_idea
better_than:
- framework: what-how-why
  when: Items do not share a single 'what' and do not need a 'why' close.
- framework: single-paragraph-insight
  when: The value is in the breadth of items, not the depth of one idea.
structure:
- section: promise
  purpose: 'Number + item type + audience or outcome: ''10 powerful Twitter hacks every user should know:''.'
  length: 1 line
- section: items
  purpose: One item per line, each with a specific detail. Parallel grammar.
  length: 3-10 items
- section: close
  purpose: A one-line takeaway, a 'keep it lean' summary, or nothing.
  length: 0-1 line
  optional: true
length:
  unit: characters
  min: 150
  max: 1500
hook_patterns:
- pattern: numbered-list-promise
  template: '{N} {item type} every {audience} should know:'
- pattern: label-opener
  template: 'My {topic} {stack/checklist}:'
- pattern: outcome-number
  template: '{N} {item type} that {specific outcome}:'
rubric:
  inherits: shared
  criteria:
  - id: item-specificity
    description: Each item is concrete (a named tool, number, action), not a platitude.
    weight: 3
    anchors:
      '1': Most items are generic ('be consistent').
      '3': Half the items are specific.
      '5': Every item carries a specific detail or example from a cited source.
    pass_threshold: 4
  - id: promise-match
    description: The list delivers exactly what the first line promised (count, type, audience).
    weight: 2
    anchors:
      '1': Count or type does not match the promise.
      '3': Matches, with a filler item or two.
      '5': Exact match, no filler.
    pass_threshold: 4
