# Generated by build/build.py from build/src/short-form/question-engagement.yaml. Edit the source, not this file.
id: question-engagement
name: Question / call to conversation
form: short
family: conversation
summary: 'A post built to start a real conversation: a short setup from a saved source, then one specific question
  the reader can answer from their own experience. Welsh''s routine slots one of these per day.'
when_to_use:
  source_signals:
  - signal: open_question
    weight: 3
    note: The source leaves something unresolved, or experts disagree.
  - signal: single_sharp_idea
    weight: 1
  - signal: breaking_news
    weight: 1
    note: A fresh change people are experiencing right now.
  goals:
    reach: 2
    trust: 2
    convert: 0
  notes: 'Welsh: specific, personal-experience questions beat ''thoughts?''. In X''s ranker, replies (5.0) and mutual
    replies (+15 boost) are high-weight predicted actions.'
avoid_when:
- condition: The question is generic ('Thoughts?', 'Agree?') or can be answered yes/no.
- condition: The account has a small audience and the post has no value without replies; add a short insight first.
- condition: The question is engagement bait (asking for likes/reposts). pelloiafilippo's summary warns that engagement
    bait is penalized (low confidence).
better_than:
- framework: single-paragraph-insight
  when: The sources disagree and the honest move is to ask rather than to pick a side.
- framework: contrarian-take
  when: You lack evidence to take a strong stance but the topic is live.
structure:
- section: setup
  purpose: One insight or observation from a saved source, so the post has value on its own.
  length: 1-4 lines
- section: question
  purpose: One specific question anchored in the reader's own experience.
  length: 1 line
- section: nudge
  purpose: Optional instruction ('Try that thing.') or a stated reason you are asking.
  length: 0-1 line
  optional: true
length:
  unit: characters
  min: 60
  max: 500
hook_patterns:
- pattern: question-opener
  template: What becomes more important as {trend}?
- pattern: label-opener
  template: '{Observation from source}. What''s the {easiest/biggest/first} {thing} you {did/noticed}?'
rubric:
  inherits: shared
  criteria:
  - id: answerable-question
    description: The question is specific and answerable from personal experience in one or two sentences.
    weight: 3
    anchors:
      '1': Generic ('Thoughts?') or yes/no.
      '3': Specific topic but abstract question.
      '5': Specific, personal, easy to answer ('What's the easiest way you could make $1 online this weekend?').
    pass_threshold: 4
    gate: true
  - id: standalone-value
    description: The setup gives value even if nobody replies.
    weight: 2
    anchors:
      '1': No setup, only a question.
      '3': Thin setup.
      '5': A clear insight precedes the question.
    pass_threshold: 3
