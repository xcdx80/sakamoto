id: story-lesson
name: Story to lesson
form: short
family: story
summary: A short personal (or sourced) story with a turning point, followed by the lesson it taught. Cole calls
  the lesson plus the story of how you learned it the 'golden intersection'.
when_to_use:
  source_signals:
  - signal: personal_story
    weight: 3
    note: The author's own experience or a story told in a saved source, with a moment of change.
  - signal: before_after
    weight: 2
  - signal: mistakes_or_regrets
    weight: 1
  goals:
    reach: 2
    trust: 3
    convert: 1
  notes: Best trust-builder. For InView, stories must come from the user's own notes or from a cited source; never
    fabricate a personal anecdote.
avoid_when:
- condition: There is no real story in the user's notes or sources. Do not invent one.
  missing_signal: personal_story
- condition: The story has no turning point or the lesson is a cliche unrelated to the details.
better_than:
- framework: single-paragraph-insight
  when: The insight is more believable when the reader sees how it was learned.
- framework: outcome-first
  when: The emotional turn matters more than the number.
structure:
- section: cold_open
  purpose: 'Drop into a specific moment: age, place, number, stakes.'
  length: 1-2 lines
- section: tension
  purpose: What went wrong or what was at stake; concrete details.
  length: 2-5 lines
- section: turn
  purpose: The moment or decision that changed things.
  length: 1-3 lines
- section: lesson
  purpose: The takeaway stated plainly, connected to the details.
  length: 1-3 lines
- section: close
  purpose: Optional link to a longer piece or a personal sign-off.
  length: 0-2 lines
  optional: true
length:
  unit: characters
  min: 200
  max: 2500
hook_patterns:
- pattern: story-cold-open
  template: At {age}, I was {specific situation}. I thought {belief}.
- pattern: before-after-gap
  template: 'When I {starting point}, {hard details}. {N} years later, {outcome}. Here''s what I''ve learned:'
- pattern: label-opener
  template: The single best {domain} lesson I ever received was {when/from whom}.
rubric:
  inherits: shared
  criteria:
  - id: concrete-scene
    description: The story has specific, sensory or numeric details, not a summary.
    weight: 2
    anchors:
      '1': Summary ('I struggled early on').
      '3': Some detail.
      '5': Specific scene the reader can picture.
    pass_threshold: 3
  - id: earned-lesson
    description: The lesson follows from the story's details rather than being bolted on.
    weight: 3
    anchors:
      '1': Generic moral unrelated to the story.
      '3': Related but stated as a cliche.
      '5': Specific lesson the story proves.
    pass_threshold: 4
  - id: story-is-real
    description: The story is from the user's own notes or a cited saved source.
    weight: 3
    anchors:
      '1': Invented or unsourced anecdote.
      '3': Sourced but details embellished.
      '5': Faithful to the source, details unchanged.
    pass_threshold: 5
    gate: true
