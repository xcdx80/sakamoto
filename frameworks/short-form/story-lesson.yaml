  text: |-
    At 22, I was making $170,000 per year working on Wall Street.

    I thought I was set for life.

    Then I looked around at the people on my floor who were 15 years older than me:

    • Commuting 3 hours per day
    • Sitting all day under fluorescent lights
    • Unable to take a break because of their golden handcuffs

    And if I got significantly more skilled or worked significantly harder?

    Maybe a 3% raise at the end of the year.

    I needed a vehicle where my extra effort actually helped me learn more and earn more.

    And this is one of the many reasons I started building:

    https://t.co/tDZVGSexHb
