# Generated by build/build.py from build/src/short-form/outcome-first.yaml. Edit the source, not this file.
id: outcome-first
name: Outcome first
form: short
family: proof
summary: Lead with a specific, verifiable result (a number, a timeframe, a constraint), then deliver the how in
  a few tight lines or bullets. The result buys attention; the method pays it back.
when_to_use:
  source_signals:
  - signal: outcome_with_numbers
    weight: 3
    note: 'The saved source states a concrete result: revenue, users, views, time saved.'
  - signal: author_has_credibility
    weight: 2
    note: The result belongs to the author or to a named, citable third party.
  - signal: process_steps
    weight: 2
    note: There is a method behind the number, not just the number.
  - signal: case_with_timeline
    weight: 1
  goals:
    reach: 3
    trust: 2
    convert: 2
  notes: Default pick when a source has a hard number and a method. Weakest when the number is soft or unverifiable.
avoid_when:
- condition: The number cannot be traced to a saved source. Never round up or invent a result to make the hook work.
  missing_signal: outcome_with_numbers
- condition: The result is the whole story and there is no method to share. That is a brag, not a post.
  missing_signal: process_steps
- condition: The audience is likely to read it as hype (e.g., income claims to a skeptical audience) and there is
    no proof to attach.
better_than:
- framework: listicle
  when: The list items all serve one measured result. The number turns a generic list into a credible one.
- framework: story-lesson
  when: The reader cares about the result more than the journey, and the source has no emotional turning point.
- framework: case-study-short
  when: The result is yours or the source author's own, not a client's, so the before/us/after scaffolding would
    feel forced.
structure:
- section: result
  purpose: State the outcome with its number and timeframe. One idea.
  length: 1-2 lines
- section: constraint_or_contrast
  purpose: 'Make the number surprising: a constraint (no ads, solo, 7 months) or a before state.'
  length: 1-3 lines
  optional: true
- section: bridge
  purpose: 'Promise the method: ''Here''s how'', ''What changed?'', ''here''s the workflow behind it:''.'
  length: 1 line
- section: method
  purpose: The steps or levers, each specific enough to act on. Cite the source for each claim.
  length: 3-7 bullets or numbered lines
- section: close
  purpose: One-line takeaway or a soft CTA. No hard sell in the body.
  length: 1-2 lines
length:
  unit: characters
  min: 180
  max: 1500
  note: Under 280 if the method fits in one line; otherwise a long post or the opener of a thread.
hook_patterns:
- pattern: outcome-number
  template: '{Subject} {achieved result} in {timeframe}. Here''s the {workflow/process} behind it:'
- pattern: before-after-gap
  template: 'I {bad starting point} in {year}. {N} years later: - {result 1} - {result 2}. What changed?'
- pattern: credibility-stack
  template: 'In {period}, I {did X}. In {next period}, I plan on {bigger X}. Here''s the {N}-step framework I use:'
rubric:
  inherits: shared
  criteria:
  - id: result-specificity
    description: The opening result is concrete, sourced, and bounded by a timeframe or constraint.
    weight: 3
    anchors:
      '1': Vague result ('grew a lot', 'crushed it') or a number with no source.
      '3': Specific number but missing timeframe or context, or the source is a secondhand claim.
      '5': Exact number, timeframe and constraint, each traceable to a cited saved source.
    pass_threshold: 4
    gate: true
    checks:
    - first 2 lines contain a digit
    - every number appears in a cited source
  - id: method-earns-the-number
    description: The method section explains how the result happened, not just more results.
    weight: 2
    anchors:
      '1': No method, or the 'how' is generic advice anyone could write.
      '3': Method present but steps are abstract ('focus on quality').
      '5': Each step is specific to this case and could be copied by the reader.
    pass_threshold: 3
