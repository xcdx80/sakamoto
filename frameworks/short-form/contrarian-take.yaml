# Generated by build/build.py from build/src/short-form/contrarian-take.yaml. Edit the source, not this file.
id: contrarian-take
name: Contrarian take
form: short
family: opinion
summary: Name a belief the audience holds, say plainly that it is wrong or incomplete, and back the correction with
  evidence or experience from a saved source. Tension drives reading; proof keeps it honest.
when_to_use:
  source_signals:
  - signal: common_belief_to_contradict
    weight: 3
    note: The source contradicts something widely repeated in the niche.
  - signal: data_or_stats
    weight: 2
    note: There is evidence for the correction, not just an opinion.
  - signal: author_has_credibility
    weight: 2
  - signal: single_sharp_idea
    weight: 1
  goals:
    reach: 3
    trust: 2
    convert: 1
  notes: Use when the saved source gives you a reason the common view is wrong. Contrarian without proof reads as
    bait.
avoid_when:
- condition: The 'common belief' is a straw man nobody actually holds.
- condition: The only evidence is the author's opinion and the claim is high-stakes (health, money, legal).
  missing_signal: data_or_stats
- condition: The source itself is unverified or low-credibility; a strong stance on weak evidence will backfire.
better_than:
- framework: single-paragraph-insight
  when: The idea only lands because it pushes against a known belief. Naming the belief makes it sharper.
- framework: old-vs-new
  when: There is one wrong belief to correct rather than two complete ways of working to compare.
- framework: listicle
  when: You have one strong correction instead of many small tips.
structure:
- section: belief
  purpose: State the common belief in the audience's own words, or call out who holds it.
  length: 1-2 lines
- section: turn
  purpose: 'A short line that flips it: ''And that''s wrong.'', ''Sometimes.'''
  length: 1 line
- section: evidence
  purpose: 'Why: data, a case, or lived experience from the cited source.'
  length: 2-5 lines
- section: reframe
  purpose: What to believe or do instead.
  length: 1-3 lines
- section: close
  purpose: Punchy restatement or a question that invites disagreement.
  length: 1 line
  optional: true
length:
  unit: characters
  min: 120
  max: 1200
hook_patterns:
- pattern: contrarian-callout
  template: A lot of people say, "{common belief}". {One-word turn}.
- pattern: blunt-truth
  template: I regret to inform you that {uncomfortable truth}.
- pattern: curiosity-gap-real-reason
  template: 'Most people think {X}. But {X} is wrong. Here''s the real reason {Y} happened:'
- pattern: not-what-you-think
  template: 'The most {adjective} {thing}: (It''s not {obvious answer}) It''s {answer}.'
rubric:
  inherits: shared
  criteria:
  - id: belief-is-real
    description: The contradicted belief is one the target audience actually holds.
    weight: 2
    anchors:
      '1': Straw man or a belief nobody states.
      '3': Plausible belief but phrased generically.
      '5': Belief phrased the way the audience says it, ideally quoted from a saved source.
    pass_threshold: 3
  - id: evidence-for-turn
    description: The correction is supported by cited evidence, not just tone.
    weight: 3
    anchors:
      '1': No evidence; the post relies on attitude.
      '3': One supporting point, loosely sourced.
      '5': Specific evidence (number, case, experience) traceable to a saved source.
    pass_threshold: 4
    gate: true
  - id: fair-tone
    description: Pushes hard on the idea without insulting the people who hold it.
    weight: 1
    anchors:
      '1': Mocks or insults the audience.
      '3': Edgy but defensible.
      '5': Firm stance, generous to the reader.
    pass_threshold: 3
