id: single-paragraph-insight
name: Single-paragraph insight
form: short
family: opinion
summary: One thought-provoking paragraph on a core topic. It takes a stance, uses economical language, and alternates
  long and short sentences. The dense block stands out in a feed of line breaks.
when_to_use:
  source_signals:
  - signal: single_sharp_idea
    weight: 3
    note: The source boils down to one insight worth stating well.
  - signal: common_belief_to_contradict
    weight: 1
  - signal: author_has_credibility
    weight: 1
  goals:
    reach: 2
    trust: 3
    convert: 0
  notes: 'Cole: take a strong stance; alternate long and short sentences; use light literary touches (alliteration,
    repetition, antithesis).'
avoid_when:
- condition: The idea needs steps, data tables or many examples to be understood.
  signal: process_steps
- condition: You have nothing beyond a platitude; the format exposes thin ideas.
better_than:
- framework: listicle
  when: There is one idea, and splitting it into bullets would make it feel like a checklist.
- framework: contrarian-take
  when: The stance does not need a named opponent to land.
structure:
- section: label_or_claim
  purpose: Open with a label ('Underrated life advice:') or the claim itself.
  length: 1 sentence
- section: development
  purpose: Concrete images or examples that make the claim felt, in mixed sentence lengths.
  length: 3-7 sentences
- section: landing
  purpose: A short final sentence that restates the idea memorably.
  length: 1 sentence
length:
  unit: characters
  min: 150
  max: 600
hook_patterns:
- pattern: label-opener
  template: 'Underrated {domain} advice: {claim}.'
- pattern: blunt-truth
  template: I'm convinced that {claim}.
- pattern: parallel-best
  template: The best {X} is the one {plain truth}. The best {Y} is {plain truth}.
rubric:
  inherits: shared
  criteria:
  - id: stance
    description: States a clear position instead of hedging.
    weight: 2
    anchors:
      '1': Hedged or neutral.
      '3': Clear position, generic phrasing.
      '5': Clear, specific, memorable position.
    pass_threshold: 3
  - id: sentence-rhythm
    description: Mix of short and long sentences; concrete nouns and verbs; no filler.
    weight: 2
    anchors:
      '1': Uniform sentence length or padded.
      '3': Some rhythm, a few filler phrases.
      '5': Deliberate rhythm; every sentence earns its place.
    pass_threshold: 3
